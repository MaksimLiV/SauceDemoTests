name: Run Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore project dependencies
        run: dotnet restore

      - name: Build and install Playwright browsers
        run: |
          dotnet build
          pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run Sauce Demo tests
        run: dotnet test --settings ci.runsettings --logger "html;logfilename=test-report.html" --results-directory TestResults
        env:
          SECRET_USERNAME: ${{ secrets.SECRET_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: TestResults/test-report.html